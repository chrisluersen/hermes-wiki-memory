name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps for manifest check
        run: |
          python -m pip install --quiet fastapi pyyaml pytest

      - name: Compile all Python
        run: |
          python -m py_compile __init__.py wiki_client.py dashboard/plugin_api.py
          echo "py_compile OK"

      - name: Run behavioral tests
        run: |
          python tests/run.py

      - name: Validate dashboard manifest + API
        run: |
          python -c "
          import json, importlib.util, sys
          m = json.load(open('dashboard/manifest.json'))
          assert m.get('name') == 'wiki', 'dashboard manifest name'
          assert m.get('tab', {}).get('path'), 'dashboard manifest tab.path'
          assert m.get('entry'), 'dashboard manifest entry'
          assert m.get('api'), 'dashboard manifest api'
          print('dashboard manifest OK:', m['name'], m['version'])
          "

      - name: Validate plugin.yaml
        run: |
          python -c "
          import yaml, json, sys
          with open('plugin.yaml') as f:
              m = yaml.safe_load(f)
          assert m.get('name'), 'plugin.yaml missing name'
          assert m.get('version'), 'plugin.yaml missing version'
          print('manifest OK:', m['name'], m['version'])
          "

      - name: Confirm no doc-prose in a skills bundle (scanner trap)
        run: |
          python -c "from pathlib import Path; import sys; found=Path('skills').is_dir(); print('ERROR: bundled skills/ tripped the plugin scanner (dangerous verdict). Keep prose out of the bundle.' if found else 'no bundled skills/ OK'); sys.exit(1 if found else 0)"
