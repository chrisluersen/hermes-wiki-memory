manifest_version: 1
name: wiki
title: "Wiki Memory Provider"
description: "Experimental local-first Hermes memory provider with canonical Markdown, bounded lexical recall, and optional shared GBrain retrieval"
version: "0.4.0"
author: "chrisluersen"
license: "MIT"
kind: "exclusive"
category: "memory"
provides_dashboard: true
requires:
  - Hermes Agent with the current MemoryProvider and tool-registry interfaces
  - Existing canonical Markdown Wiki (custom roots supported)
  - Optional shared GBrain MCP server for semantic recall
provides:
  - bounded per-turn Wiki recall with lexical fallback
  - optional semantic recall through an attested shared GBrain MCP owner
  - immutable redacted session, memory, and delegation captures
  - semantic role mapping and adopt-existing layout support
  - read-only dashboard health, counts, and activity
config:
  memory:
    provider: "wiki"
