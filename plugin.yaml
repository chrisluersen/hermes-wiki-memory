name: wiki
title: "Wiki Memory Provider"
description: "Experimental local-first Wiki memory prototype; hardening required before canonical or multi-profile use"
version: "0.3.2"
author: "chrisluersen"
license: "MIT"
category: "memory"
provides_dashboard: true
requires:
  - gbrain CLI (bun install -g github:garrytan/gbrain)
  - Wiki (brain repo) at <HERMES_ROOT>/wiki
  - gbrain embeddings backend (e.g. ZEROENTROPY_API_KEY or a local model)
provides:
  - wiki memory provider (per-turn semantic recall via gbrain CLI)
  - on_session_end insight extraction
  - on_memory_write mirror to wiki
  - on_delegation capture
  - prefetch per-turn recall
  - dashboard status + activity tab (read-only)
config:
  memory:
    provider: "wiki"
